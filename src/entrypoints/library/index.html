<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClipGrail Library</title>
  </head>
  <body>
    <div id="narrow-top" class="narrow-top">
      <select id="view-select" aria-label="Show sources of"></select>
      <button id="narrow-new-session" class="icon-btn" type="button" title="New session" aria-label="New session" aria-haspopup="dialog"><span data-icon="plus"></span></button>
      <button id="back-button" class="link back" type="button" hidden></button>
      <span id="narrow-position" class="small"></span>
      <button id="narrow-session-actions" type="button" aria-haspopup="dialog" hidden>Session ···</button>
    </div>

    <nav id="nav" class="col nav" aria-label="Sessions">
      <div class="brand">
        <span data-mark></span><h1>Library</h1>
        <button id="toggle-sessions" class="icon-btn" type="button" title="Hide sessions" aria-label="Hide sessions" aria-expanded="true" aria-controls="nav"><span data-icon="sidebar-simple"></span></button>
      </div>
      <div id="nav-list" class="nav-list"></div>
    </nav>

    <section id="list-col" class="col list-col" aria-labelledby="list-title">
      <div class="list-top">
        <div class="list-head">
          <h2 id="list-title"></h2>
          <span id="result-count" class="count" role="status"></span>
          <div id="mode-switch" class="mode-switch" role="group" aria-label="Show">
            <button id="mode-sources" type="button" aria-pressed="true">Sources</button>
            <button id="mode-timeline" type="button" aria-pressed="false" title="Captures and visits in time order">Timeline</button>
            <button id="mode-pivots" type="button" aria-pressed="false" title="Values shared across sources">Pivots</button>
          </div>
        </div>
        <label class="search"><span data-icon="magnifying-glass"></span><input id="search" type="search" placeholder="Search text, notes, title or address" aria-label="Search text, notes, title or address" title="All words must match. Use &quot;quotes&quot; for a phrase, or site:example.org, after:2026-10-01, before:2026-10-31." autocomplete="off" /><kbd aria-hidden="true">/</kbd></label>
        <div class="filters">
          <select id="status-filter" aria-label="Status">
            <option value="any">All statuses</option>
            <option value="ok">Text saved</option>
            <option value="partial">Partial text</option>
            <option value="pending">URL only</option>
            <option value="failed">Capture failed</option>
            <option value="none">Selections only</option>
          </select>
          <select id="sort" aria-label="Sort"></select>
          <button id="important-filter" class="btn-sm icon-only" type="button" aria-pressed="false" aria-label="Show only sources marked important" title="Show only sources marked important"><span data-icon="star"></span></button>
          <select id="pivot-kind" aria-label="Kind" hidden></select>
          <button id="shared-only" class="btn-sm" type="button" aria-pressed="true" title="Show only values found in two or more sources" hidden>Shared only</button>
          <button id="copy-pivots" class="btn-sm" type="button" title="Copy as a tab-separated table" hidden><span data-icon="copy"></span>Copy list</button>
          <button id="pivot-filter" class="btn-sm filter-on" type="button" hidden></button>
          <select id="log-session" aria-label="Session" hidden></select>
          <button id="clear-log" class="btn-sm" type="button" aria-haspopup="dialog" hidden>Clear log…</button>
          <button id="clear-filters" class="link" type="button" hidden>Clear filters</button>
        </div>
        <div id="selection-bar" class="selection-bar" hidden>
          <input id="select-all" type="checkbox" title="Select all shown sources" aria-label="Select all shown sources" />
          <b id="selection-count" role="status"></b>
          <span class="selection-actions">
            <button id="clip-selected" class="btn-sm" type="button" title="Save the text of the selected URL-only pages" hidden></button>
            <button id="open-selected" class="btn-sm icon-only" type="button" title="Open the selected pages in new tabs" aria-label="Open the selected pages in new tabs"><span data-icon="arrow-square-out"></span></button>
            <button id="delete-selected" class="btn-sm delete icon-only" type="button" aria-haspopup="dialog" title="Delete selected sources" aria-label="Delete selected sources"><span data-icon="trash"></span></button>
            <button id="clear-selection" class="icon-btn" type="button" title="Clear selection" aria-label="Clear selection"><span data-icon="x"></span></button>
          </span>
        </div>
      </div>
      <ul id="rows" class="rows" aria-labelledby="list-title"></ul>
      <div id="list-empty" class="empty" hidden></div>
      <p id="list-note" class="list-note" hidden></p>
    </section>

    <section id="reader-col" class="col reader-col" aria-label="Source" tabindex="-1">
      <div id="reader" class="reader"></div>
    </section>
    <!-- Shown once the open source is scrolled down more than its column's height. -->
    <button id="back-to-top" class="back-to-top" type="button" title="Back to top" aria-label="Back to top" hidden><span data-icon="arrow-up"></span></button>
    <!-- Shown next to Move to… while a source is open. -->
    <button id="expand-reader" class="icon-btn" type="button" data-id="expand-reader" aria-pressed="false" hidden>
      <span class="icon-expand" data-icon="arrows-out-simple"></span>
      <span class="icon-collapse" data-icon="arrows-in-simple"></span>
    </button>
    <!-- Column borders: drag, or use the arrow keys, to change a column's width; double-click restores it. -->
    <div id="resize-nav" class="resize-handle" role="separator" aria-orientation="vertical" aria-controls="nav" aria-label="Width of the sessions column" title="Drag to resize; double-click to reset" tabindex="0"></div>
    <div id="resize-list" class="resize-handle" role="separator" aria-orientation="vertical" aria-controls="list-col" aria-label="Width of the sources column" title="Drag to resize; double-click to reset" tabindex="0"></div>
    <dialog id="library-dialog" aria-label="Organize research"></dialog>
    <div id="library-notice" class="library-notice" role="status" hidden></div>
    <p id="compare-said" class="visually-hidden" aria-live="polite"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
